# yaml-language-server: $schema=../../.helm-shared/values.schema.json

# A group of IOCs that differ only by environment - one config folder, one
# image, one set of resources, rendered once per entry in iocs below.
# For a single IOC use .ioc_template instead.

# settings shared by every IOC in the group
ioc-instance:
  image: gitlab.diamond.ac.uk:5050/controls/containers/iocs/ioc-d2dcc/ioc-d2dcc-linux-runtime:add-dcc-modules
  imagePullPolicy: Always

  env:
    - name : FPGA_BIN_DIR
      value: /dls/tmp/d2dcc-fpga/
# Ensure the server log files are not in /opt/server as they will be deleted
# when the next pod is created
    - name : SERVER_LOG_FILE
      value: /opt/server.log
    - name: TELNET_SERVER
      value: TS0001
    - name : D2DCC_DIR
      value: /epics/support/d2dcc

  volumes:
   - name: dls-tmp
     nfs:
       path: /vol/dls_tmp/dls_tmp
       server: cs04r-nas01-02.diamond.ac.uk
       readOnly: true

  volumeMounts:
   - name: dls-tmp
     mountPath: /dls/tmp

  nodeSelector:
    nodetype: accelerator-ioc

  tolerations:
    - key: nodetype
      operator: Equal
      value: accelerator-ioc
      effect: NoSchedule

# One entry per IOC. Every entry MUST have a NAME - it is appended to the
# release name, so a folder called ixx-ea-thing deploys ixx-ea-thing-01 and
# ixx-ea-thing-02 below, each with its own StatefulSet, ConfigMap and PVC.
# The remaining keys become extra container environment variables for that
# IOC alone; read them back in config/ioc.yaml with _global.get_env().
#
# NOTE: the variables reach the container in alphabetical order, so do not
# rely on k8s $(VAR) references between them.
iocs:
###### AUTOGENERATED FROM MAGNET SPREADSHEET ON 2026-08-18 11:54:14.736681 ######
#### ANYTHING WRITTEN BELOW THIS LINE WILL BE ERASED DURING NEXT GENERATION #####

  - NAME: colibri30
    TELNET_PORT: 7030
    FPGA_TYPE: SIC_DPS
    FPGA_TYPE_NUMBER: 130
